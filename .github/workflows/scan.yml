name: scan
on:
  workflow_dispatch: {}      # основной механизм: ранн сам запускает следующий
  schedule:
    - cron: "17 * * * *"     # страховка раз в час: если цепочка умрёт — разбудит

concurrency:
  group: scan
  cancel-in-progress: false  # циклы выстраиваются в очередь, не пересекаются

permissions:
  contents: write            # суточный heartbeat
  actions: write             # самозапуск следующего цикла

jobs:
  scan-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Восстановить базу из кэша
        uses: actions/cache/restore@v4
        with:
          path: |
            data/ads.db
            data/publish_state.json
          key: ads-db-${{ github.run_number }}
          restore-keys: |
            ads-db-

      - name: Скан + публикация
        run: python scan_once.py
        env:
          HERENOW_SLUG: ${{ secrets.HERENOW_SLUG }}
          HERENOW_CLAIM: ${{ secrets.HERENOW_CLAIM }}
          HERENOW_API_KEY: ${{ secrets.HERENOW_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

      - name: Сохранить базу в кэш
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/ads.db
            data/publish_state.json
          key: ads-db-${{ github.run_number }}

      - name: Heartbeat (не даём GitHub выключить расписание)
        run: |
          D=$(date -u +%F)
          if [ "$(cat data/last_day.txt 2>/dev/null)" != "$D" ]; then
            echo "$D" > data/last_day.txt
            git config user.name "scan-bot"
            git config user.email "actions@github.com"
            git add data/last_day.txt
            git commit -m "heartbeat $D" && git push || echo "push пропущен"
          fi

      - name: Следующий цикл (цепочка)
        if: always()
        run: |
          sleep 5
          gh workflow run scan.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
